[project]
name = "step2api"
version = "1.0.0"
description = "StepFun Step Plan 多账号聚合网关：额度/Plan 时长监控、粘性路由、独立代理与代理轮转"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "huanxueshengmou" }]
keywords = ["stepfun", "step-plan", "openai-proxy", "anthropic-proxy", "load-balancer", "sticky-routing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Internet :: Proxy Servers",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx[socks]>=0.27",
    "pydantic>=2.7",
    "cryptography>=42.0",
]

[project.optional-dependencies]
# 浏览器登录导入。复用系统已装的 Chrome/Edge，无需 `playwright install`。
browser = ["playwright>=1.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
step2api = "step2api.__main__:main"

[project.urls]
Homepage = "https://github.com/huanxueshengmou/step2api"
Repository = "https://github.com/huanxueshengmou/step2api"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["step2api"]

[tool.hatch.build.targets.wheel.force-include]
"step2api/static" = "step2api/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
